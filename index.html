<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Button Clicker Simulator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Button Clicker Simulator</h1>
    <div id="score" aria-live="polite">0</div>
    <button id="clicker">Click me</button>

    <div class="controls">
      <button id="reset">Reset</button>
      <label class="auto"><input type="checkbox" id="autoclick"> Auto-click (+1/sec)</label>
    </div>

    <footer>
      <small>Score is saved in your browser (localStorage).</small>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
